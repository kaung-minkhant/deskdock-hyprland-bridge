[package]
name = "hypr-android-bridge"
version = "0.1.0"
edition = "2024"
description = "Experimental Hyprland-to-Android input bridge"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
evdev = "0.13"
ksni = { version = "0.3.7", features = ["blocking"] }
libc = "0.2.191"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
